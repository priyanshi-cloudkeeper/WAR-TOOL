<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GCP Architecture – Interactive Map</title>

  <!-- Vis Network -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: radial-gradient(circle at top left, #eef2ff 0%, #f8fafc 45%, #ffffff 100%);
      --panel-bg: rgba(255,255,255,.97);
      --border: rgba(148,163,184,.35);
      --shadow: 0 20px 50px rgba(15,23,42,.10);
      --radius: 16px;
      --primary: #4c6ef5;
      --muted: #94a3b8;
      --text: #1e293b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg-main);
      color: var(--text);
      overflow: hidden;
    }

    /* ===== Layout ===== */
    .app-shell {
      height: 100%;
      padding: 14px;
      display: flex;
      flex-direction: column;
    }

    .app-main {
      flex: 1;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 14px;
      min-height: 0;
    }

    /* ===== Sidebar ===== */
    .app-sidebar {
      background: var(--panel-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 18px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-section-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 18px 0 8px;
    }

    .control-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    #node-search {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      background: #f8fafc;
      font-size: 12px;
      outline: none;
    }

    input { accent-color: var(--primary); }

    .btn-export {
      margin-top: auto;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #4c6ef5, #748ffc);
      color: white;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(76,110,245,.35);
    }

    /* ===== Canvas ===== */
    .app-canvas {
      background: var(--panel-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    #mynetwork {
      width: 100%;
      height: 100%;
    }

    /* ===== Node Detail Panel ===== */
    .node-detail-panel {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 320px;
      max-height: calc(100% - 28px);
      background: rgba(255,255,255,.98);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: -18px 0 40px rgba(15,23,42,.12);
      display: none;
      flex-direction: column;
      padding: 14px;
      overflow-y: auto;
      z-index: 1000;
    }

    .node-detail-header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 10px;
    }

    .node-detail-title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.35;
    }

    .node-detail-subtitle {
      font-size: 10px;
      color: var(--muted);
      line-height: 1.4;
      word-break: break-all;
    }

    .close-btn {
      border: none;
      background: none;
      font-size: 20px;
      color: #cbd5e1;
      cursor: pointer;
    }

    /* ===== Icon container (visual frame) ===== */
    .node-detail-icon-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      height: 56px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      margin-bottom: 10px;
    }

    /* ===== Icon normalization ===== */
    #node-detail-icon {
      width: 28px;              /* visual size, not container size */
      height: 28px;
      object-fit: contain;
      transform: scale(1.05);  /* optical correction */
    }


    /* ===== GRID METADATA (NO OVERLAP) ===== */
    /* ===== Detail sections ===== */
    .node-detail-section-title {
      margin: 12px 0 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Key-value rows */
    .node-detail-kv-row {
      display: grid;
      grid-template-columns: minmax(90px, 38%) 1fr;
      column-gap: 10px;
      padding: 4px 0;
      border-bottom: 1px dashed #e5e7eb;
    }

    .node-detail-kv-label {
      font-size: 10.5px;
      color: var(--muted);
      line-height: 1.4;
    }

    .node-detail-kv-value {
      font-size: 10.5px;
      font-weight: 600;
      text-align: right;
      word-break: break-word;
      line-height: 1.4;
    }

    /* Chips */
    .node-detail-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .node-detail-chip {
      background: #eef2ff;
      color: #364fc7;
      font-size: 9.5px;
      font-weight: 600;
      padding: 3px 6px;
      border-radius: 999px;
    }


        .kv-key {
          color: var(--muted);
          font-weight: 500;
          line-height: 1.45;
        }

        .kv-value {
          font-weight: 600;
          text-align: right;
          word-break: break-word;
          line-height: 1.45;
        }
  </style>
</head>

<body>
  <div class="app-shell">
    <div class="app-main">

      <!-- Sidebar -->
      <aside class="app-sidebar">
        <div class="sidebar-section-title">Search Infrastructure</div>
        <input id="node-search" placeholder="Search by name, type or project">

        <div class="sidebar-section-title">Layout</div>
        <div class="control-card">
          <label><input type="radio" name="layout-mode" value="tiered" checked> Tiered hierarchy</label><br><br>
          <label><input type="radio" name="layout-mode" value="force"> Force directed</label>
        </div>

        <div class="sidebar-section-title">Physics</div>
        <div class="control-card">
          <label><input type="checkbox" id="physics-toggle"> Enable physics</label>
          <input type="range" id="spacing-range" min="100" max="400" value="160">
        </div>

        <button class="btn-export" onclick="downloadImage()">Export PNG</button>
      </aside>

      <!-- Canvas -->
      <main class="app-canvas">
        <div id="mynetwork"></div>

        <div id="node-detail-panel" class="node-detail-panel">
          <div class="node-detail-header">
            <div>
              <div id="node-detail-title" class="node-detail-title"></div>
              <div id="node-detail-subtitle" class="node-detail-subtitle"></div>
            </div>
            <button id="node-detail-close" class="close-btn">&times;</button>
          </div>

          <div class="node-detail-icon-wrap">
            <img id="node-detail-icon">
          </div>

          <div id="node-detail-body" class="kv-grid"></div>
        </div>
      </main>

    </div>
  </div>

  <!-- DO NOT CHANGE ORDER -->
  <script src="graphData.js"></script>
  <script src="network.js"></script>
</body>
</html>
